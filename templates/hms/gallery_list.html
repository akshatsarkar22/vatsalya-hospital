{% extends 'hms/base.html' %}
{% load static %}

{% block hms_content %}
<div class="hms-card mb-4">
  <div class="hms-card-header">
    <h5><i class="bi bi-images me-2 text-primary"></i>Photo Gallery</h5>
    <a href="{% url 'hms_gallery_upload' %}" class="btn-hms-primary">
      <i class="bi bi-upload"></i> Upload Image
    </a>
  </div>

  <div class="p-3">
    <div class="row g-3">
      {% for img in images %}
      <div class="col-6 col-md-4 col-lg-3">
        <div class="position-relative" style="border-radius:10px;overflow:hidden;box-shadow:var(--shadow);">
          <img src="{{ img.image.url }}" alt="{{ img.title }}"
               style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block;">
          <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);padding:.75rem .6rem .5rem;">
            <div class="text-white fw-semibold" style="font-size:.8rem;">{{ img.title|default:"Untitled" }}</div>
            <div class="text-white-50" style="font-size:.7rem;">{{ img.category }}</div>
          </div>
          <form method="POST" action="{% url 'hms_gallery_delete' img.pk %}"
                style="position:absolute;top:.4rem;right:.4rem;"
                onsubmit="return confirm('Delete this image?');">
            {% csrf_token %}
            <button type="submit" class="btn-sm-icon btn-del" style="width:28px;height:28px;" title="Delete">
              <i class="bi bi-trash-fill"></i>
            </button>
          </form>
        </div>
      </div>
      {% empty %}
      <div class="col-12 text-center py-5 text-muted">
        <i class="bi bi-images fs-1 d-block mb-3"></i>
        No images in gallery. <a href="{% url 'hms_gallery_upload' %}">Upload the first one</a>.
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
