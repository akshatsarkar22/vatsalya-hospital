{% extends 'hms/base.html' %}
{% load static %}

{% block hms_content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="hms-card">
      <div class="hms-card-header">
        <h5><i class="bi bi-chat-quote me-2 text-primary"></i>{{ page_title }}</h5>
        <a href="{% url 'hms_testimonials' %}" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Back
        </a>
      </div>
      <div class="p-4">
        <form method="POST">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold text-uppercase small" for="{{ field.id_for_label }}">
              {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <div class="invalid-feedback d-block">{{ field.errors.0 }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <div class="text-end">
            <button type="submit" class="btn-hms-primary px-4">
              <i class="bi bi-save me-1"></i> {{ action }} Testimonial
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
