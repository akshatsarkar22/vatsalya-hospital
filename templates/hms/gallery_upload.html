{% extends 'hms/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block hms_content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="hms-card p-4">
      <h5 class="mb-3 fw-bold"><i class="bi bi-cloud-upload-fill text-primary me-2"></i>Upload Photo to Gallery</h5>
      <hr>
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="mb-3">
          {{ form.image|as_crispy_field }}
        </div>
        
        <div class="mb-3">
          {{ form.title|as_crispy_field }}
        </div>
        
        <div class="mb-4">
          {{ form.category|as_crispy_field }}
        </div>
        
        <div class="text-end">
          <a href="{% url 'hms_gallery' %}" class="btn btn-outline-secondary me-2">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">Upload Image</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
